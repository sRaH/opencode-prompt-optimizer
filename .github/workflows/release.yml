name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Package directory plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "opencode-prompt-optimizer-${TAG}.tar.gz" package.json bun.lock README.md LICENSE server.js tui.js dist
          sha256sum "opencode-prompt-optimizer-${TAG}.tar.gz" > "opencode-prompt-optimizer-${TAG}.tar.gz.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "opencode-prompt-optimizer-${TAG}.tar.gz" "opencode-prompt-optimizer-${TAG}.tar.gz.sha256" --verify-tag --generate-notes --title "$TAG"
